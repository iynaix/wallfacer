[package]
name = "wallfacer"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
path = "src/lib/mod.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus-free-icons = { version = "0.10.0", features = [
    "lucide",
    "material-design-icons-action",
    "material-design-icons-device",
    "material-design-icons-editor",
    "material-design-icons-image",
    "material-design-icons-navigation",
] }
clap = { version = "4.6.7", features = ["derive", "string"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
dioxus = { version = "0.7.10", features = ["desktop"] }
dirs = "7.0.0"
image = "0.25.10"
indexmap = "2.14.2"
itertools = "0.15.0"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["process"] }
rayon = "1.12.0"
toml = "1.1.6"
which = "8.0.6"
numeric-sort = "0.1.5"
xmpkit = "0.1.6"

[build-dependencies]
clap = { version = "4.6.7", features = ["derive", "string"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"

[features]
default = ["trimmer"]
adding = []
trimmer = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
derive_partial_eq_without_eq = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
uninlined_format_args = { level = "allow", priority = 1 }
unwrap_used = "deny"
volatile_composites = { level = "allow", priority = 1 }

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
